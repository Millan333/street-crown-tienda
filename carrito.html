<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Carrito | STREET CROWN HATS</title>

    <!-- CSS -->
    <link rel="stylesheet"
          href="/css/normalize.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Staatliches&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="/css/color.css">

    <link rel="shortcut icon"
          href="/img1/Street.png">

</head>

<body>

<!-- HEADER -->
<header class="header sticky-top bg-dark">

    <nav class="navbar navbar-expand-lg navbar-dark container">

        <div class="container-fluid">

            <!-- LOGO -->
            <a class="navbar-brand"
               href="index.html">

                <img class="logo"
                     src="/img1/Street.png"
                     alt="Street Crown Hats Logo"
                     width="60">

            </a>

            <!-- BOTON MOVIL -->
            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav"
                    aria-controls="navbarNav"
                    aria-expanded="false"
                    aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>

            </button>

            <!-- MENU -->
            <div class="collapse navbar-collapse"
                 id="navbarNav">

                <ul class="navbar-nav ms-auto align-items-center text-white bg-dark">

                    <li class="nav-item">

                        <a class="nav-link"
                           href="gorras.html">

                            Gorras

                        </a>

                    </li>

                    <li class="nav-item">

                        <a class="nav-link"
                           href="playeras.html">

                            Camisas

                        </a>

                    </li>

                    <li class="nav-item">

                        <a class="nav-link"
                           href="nosotros.html">

                            Nosotros

                        </a>

                    </li>

                    <!-- ICONO -->
                    <li class="nav-item">

                        <a class="nav-link d-flex align-items-center"
                           href="carrito.html">

                            <span style="
                                font-size:2rem;
                                color:white;
                                line-height:1;
                            ">
                                🛒
                            </span>

                            <span id="contador-carrito"
                                  class="badge rounded-pill bg-danger ms-2">

                                0

                            </span>

                        </a>

                    </li>

                </ul>

            </div>

        </div>

    </nav>

</header>

<main class="container py-5">

    <h1 class="text-center text-white mb-5">

        TU CARRITO

    </h1>

    <!-- PRODUCTOS -->
    <div id="lista-carrito"></div>

    <!-- TOTAL -->
    <div class="card bg-dark text-white p-3 mt-4">

        <h3 class="text-end">

            TOTAL:
            <span id="total-carrito">

                $0

            </span>

        </h3>

    </div>

    <!-- BOTONES -->
    <div class="d-grid gap-3 mt-4">

        <button class="btn btn-success btn-lg"
                onclick="comprarWhatsApp()">

            Comprar por WhatsApp

        </button>

        <button class="btn btn-danger btn-lg"
                onclick="vaciarCarrito()">

            Vaciar carrito

        </button>

    </div>

</main>

<!-- FOOTER -->
<footer class="footer py-2 bg-black text-white text-center mt-5">

    <div class="container">

        <p class="h3 mb-3">

            STREET CROWN HATS

        </p>

        <!-- REDES -->
        <div class="d-flex justify-content-center gap-4 mb-3">

            <a href="https://www.instagram.com/streetcrownhats2026"
               target="_blank"
               class="fs-2 text-white">

                <i class="bi bi-instagram"></i>

            </a>

            <a href="https://www.facebook.com/share/17yrbt4G8b/"
               target="_blank"
               class="fs-2 text-white">

                <i class="bi bi-facebook"></i>

            </a>

            <a href="https://www.tiktok.com/@streetcrownhats7"
               target="_blank"
               class="fs-2 text-white">

            </a>

        </div>

        <p class="small text-secondary mt-3">

            &copy; 2026 STREET CROWN HATS.
