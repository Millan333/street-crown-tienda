<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STREET CROWN HATS</title>
    <link rel="stylesheet" href="/css/normalize.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Staatliches&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/color.css">
    <link rel="shortcut icon" href="/img1/Street.png">
</head>
<body>

    <!-- HEADER -->
<header class="header sticky-top bg-dark">

    <nav class="navbar navbar-expand-lg navbar-dark container">

        <div class="container-fluid">

            <!-- LOGO -->
            <a class="navbar-brand"
               href="index.html">

                <img class="logo"
                     src="/img1/Street.png"
                     alt="Street Crown Hats Logo"
                     width="60">

            </a>

            <!-- BOTON MOVIL -->
            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav"
                    aria-controls="navbarNav"
                    aria-expanded="false"
                    aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>

            </button>

            <!-- MENU -->
            <div class="collapse navbar-collapse"
                 id="navbarNav">

                <ul class="navbar-nav ms-auto align-items-center text-white bg-dark">

                    <!-- CATALOGO -->
                    <li class="nav-item dropdown">

                        <a class="nav-link dropdown-toggle"
                           href="#"
                           role="button"
                           data-bs-toggle="dropdown"
                           aria-expanded="false">

                            Catálogo

                        </a>

                        <ul class="dropdown-menu dropdown-menu-dark">

                            <li>

                                <a class="dropdown-item"
                                   href="gorras.html">

                                    Gorras

                                </a>

                            </li>

                            <li>

                                <a class="dropdown-item"
                                   href="playeras.html">

                                    Camisas

                                </a>

                            </li>

                            <li>

                                <a class="dropdown-item"
                                   href="#">

                                    Sudaderas

                                </a>

                            </li>

                        </ul>

                    </li>

                    <!-- NOSOTROS -->
                    <li class="nav-item">

                        <a class="nav-link mx-lg-3"
                           href="nosotros.html">

                            Nosotros

                        </a>

                    </li>

                    <!-- CARRITO -->
                    <li class="nav-item dropdown">

                        <a class="nav-link d-flex align-items-center"
                           href="#"
                           role="button"
                           data-bs-toggle="dropdown"
                           onclick="abrirCarritoMovil()">

                            <!-- ICONO -->
                            <span style="
                                font-size:2rem;
                                color:white;
                                line-height:1;
                            ">

                                🛒

                            </span>

                            <!-- CONTADOR -->
                            <span id="contador-carrito"
                                  class="badge rounded-pill bg-danger ms-2">

                                0

                            </span>

                        </a>

                        <!-- MINI CARRITO -->
                        <ul class="dropdown-menu dropdown-menu-end p-3"
                            id="mini-carrito"
                            style="
                                width:320px;
                                max-height:400px;
                                overflow-y:auto;
                            ">

                            <!-- TITULO -->
                            <li class="d-flex justify-content-between align-items-center mb-2">

                                <h5 class="text-dark m-0">

                                    Carrito

                                </h5>

                                <!-- BOTON VACIAR -->
                                <button class="btn btn-danger btn-sm"
                                        onclick="vaciarCarrito()">

                                    Vaciar

                                </button>

                            </li>

                            <hr>

                            <!-- PRODUCTOS -->
                            <div id="lista-carrito"></div>

                            <hr>

                            <!-- TOTAL -->
                            <div class="d-flex justify-content-between align-items-center mb-3">

                                <strong class="text-dark">

                                    Total:

                                </strong>

                                <strong class="text-dark"
                                        id="total-carrito">

                                    $0

                                </strong>

                            </div>

                            <!-- BOTON COMPRAR -->
                            <button class="btn btn-success w-100"
                                    onclick="comprarWhatsApp()">

                                Comprar

                            </button>

                        </ul>

                    </li>

                </ul>

            </div>

        </div>

    </nav>

</header>

    
    <footer class="footer">

    <div class="footer__redes">
        <a href="https://www.instagram.com/streetcrownhats2026?igsh=cHZseDM4MnV1Zmp0" target="blank" class="footer_icono">

            <i class="bi bi-tiktok"></i>
        </a>
    </div>
    
    <p class="footer__copyright">&copy; 2026 STREET CROWN HATS. Todos los derechos reservados.</p>
</footer>

    <script src="/js/carrito.js"></script>
