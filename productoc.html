<!-- =========================
     SCRIPT WHATSAPP
========================= -->

<script>

const btnWhatsapp =
document.getElementById(
    "btn-whatsapp"
);

const chatWhatsapp =
document.getElementById(
    "whatsapp-chat"
);

/* ABRIR Y CERRAR */
btnWhatsapp.addEventListener(
    "click",
    (e) => {

        e.stopPropagation();

        chatWhatsapp.classList.toggle(
            "activo"
        );

    }
);

/* CERRAR SI PICA AFUERA */
document.addEventListener(
    "click",
    (e) => {

        if(
            !chatWhatsapp.contains(e.target)
            &&
            !btnWhatsapp.contains(e.target)
        ){

            chatWhatsapp.classList.remove(
                "activo"
            );

        }

    }
);

</script>
