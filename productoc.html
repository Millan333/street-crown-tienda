                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav"
                    aria-controls="navbarNav"
                    aria-expanded="false"
                    aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto align-items-center text-white bg-dark">

                    <li class="nav-item dropdown">

                        <a class="nav-link dropdown-toggle"

                            Nosotros

                        </a>

            </div>

        </div>

    </nav>

</header>

<!-- PRODUCTO -->
<main class="container py-5">

    <div class="row justify-content-center align-items-center g-5">

        <!-- FLECHA IZQUIERDA -->
        <div class="col-auto d-flex justify-content-center">

            <button class="flecha"
                    onclick="cambiarProducto(-1)">

                ❮

            </button>

        </div>

        <!-- IMAGEN -->
        <div class="col-12 col-md-5 text-center">

            <img id="imagen-producto"
                 class="img-fluid rounded shadow"
                 src="/img1/c1.png"
                 alt="Imagen del producto">

        </div>

        <!-- INFORMACIÓN -->
        <div class="col-12 col-md-4 text-white">

            <h1 id="nombre-producto"
                class="mb-3">Abyss Signal</h1>

            <p id="descripcion-producto"
               class="mb-4">

            </p>

            <h3 id="precio-producto"
                class="mb-4"></h3>

            <!-- TALLAS -->
            <div class="mb-4">

                <label class="form-label">

                    Talla:

                </label>

                <select id="talla"
                        class="form-select talla-select">

                    <option value="CH">CH</option>
                    <option value="M">M</option>
                    <option value="G">G</option>
                    <option value="XL">XL</option>

                </select>

            </div>

            <!-- CANTIDAD -->
            <div class="mb-4">

                <label for="cantidad"
                       class="form-label">

                    Cantidad:

                </label>

                <input type="number"
                       id="cantidad"
                       class="form-control cantidad-input"
                       min="1"
                       max="10"
                       value="1">

            </div>

            <!-- BOTÓN -->
            <button class="btn btn-success btn-lg"
                    onclick="enviarPedido()">

                Comprar por WhatsApp

            </button>

        </div>

        <!-- FLECHA DERECHA -->
        <div class="col-auto d-flex justify-content-center">

            <button class="flecha"
                    onclick="cambiarProducto(1)">

                ❯

            </button>

        </div>

    </div>

</main>
